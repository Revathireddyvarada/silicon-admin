sonar.projectKey=admin-service
sonar.projectName=admin-service

sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.*,**/test/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.node.maxspace=1536

# Upload of analysis report to SonarQube CE can exceed default ~60s on slow links.
sonar.ws.timeout=300
